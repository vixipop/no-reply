<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>No Reply — visual sample v5</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500,600&family=Space+Grotesk:wght@400;500&family=Gochi+Hand&family=Caveat:wght@600&family=Fredoka:wght@600&family=Young+Serif&family=Playfair+Display:wght@600&family=Comfortaa:wght@600&family=Shrikhand&family=Baloo+2:wght@600&display=swap" rel="stylesheet">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500,600&family=Space+Grotesk:wght@400;500&family=Gochi+Hand&family=Caveat:wght@600&family=Fredoka:wght@600&family=Young+Serif&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; }

  body {
    background-color: #0A3323;
    background-image:
      repeating-linear-gradient(to right, rgba(51,107,85,0.08) 0, rgba(51,107,85,0.08) 1px, transparent 1px, transparent 100px),
      repeating-linear-gradient(to bottom, rgba(51,107,85,0.08) 0, rgba(51,107,85,0.08) 1px, transparent 1px, transparent 100px),
      repeating-linear-gradient(to right, rgba(51,107,85,0.08) 0, rgba(51,107,85,0.08) 1px, transparent 1px, transparent 20px),
      repeating-linear-gradient(to bottom, rgba(51,107,85,0.08) 0, rgba(51,107,85,0.08) 1px, transparent 1px, transparent 20px);
    font-family: 'Space Grotesk', sans-serif;
    position: relative;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .ruler-top, .ruler-left {
    position: fixed;
    z-index: 0;
    color: rgba(255,255,255,0.4);
    font-size: 10px;
    font-family: 'Space Grotesk', sans-serif;
    pointer-events: none;
  }
  .ruler-top { top: 4px; left: 0; right: 0; display: flex; }
  .ruler-top span { width: 100px; flex-shrink: 0; padding-left: 4px; }
  .ruler-left { top: 0; left: 4px; bottom: 0; display: flex; flex-direction: column; }
  .ruler-left span { height: 100px; flex-shrink: 0; padding-top: 2px; }

  .mat-label {
    position: fixed;
    top: 14px; right: 24px;
    z-index: 0;
    font-size: 11px;
    letter-spacing: 0.08em;
    color: rgba(255,255,255,0.35);
    text-transform: uppercase;
  }

  .top-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 32px 40px 0;
    position: relative;
    z-index: 1;
  }

  .streak-wrap { display: flex; align-items: center; gap: 6px; }
  .fire-icon { width: 16px; height: 16px; }
  .day-label { font-size: 13px; color: #F7F4D5; letter-spacing: 0.06em; }
  .archive-icon { width: 24px; height: 24px; opacity: 0.75; }

  /* dot-matrix star decorations, scattered and drifting slowly */
  .dotstar-deco {
    position: absolute;
    z-index: 1;
    animation: drift 8s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes drift {
    0%, 80%, 100% { transform: rotate(0deg) scale(1); }
    90% { transform: rotate(14deg) scale(1.1); }
  }
  .dotstar-deco.d1 { width: 70px; top: 120px; left: 5%; color: #FFABE7; animation-delay: 0s; opacity: 0.9; }
  .dotstar-deco.d2 { width: 50px; top: 300px; right: 6%; color: #F7F4D5; animation-delay: 1.6s; opacity: 0.7; }
  .dotstar-deco.d3 { width: 66px; bottom: 240px; left: 8%; color: #FFABE7; animation-delay: 3.2s; opacity: 0.85; }
  .dotstar-deco.d4 { width: 46px; bottom: 160px; right: 14%; color: #F7F4D5; animation-delay: 4.8s; opacity: 0.65; }

  /* 5-star progress row at top */
  .progress-row {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 22px;
    padding: 30px 0 0;
    position: relative;
    z-index: 1;
  }
  .progress-star { transition: transform 0.3s ease; }
  .progress-star.current { color: #FFABE7; width: 30px; }
  .progress-star.done { color: #E8DFC8; width: 20px; opacity: 0.5; }
  .progress-star.todo { color: #E8DFC8; width: 20px; opacity: 0.28; }

  .ascii-strip {
    font-family: 'Space Grotesk', monospace;
    font-size: 11px;
    letter-spacing: 3px;
    color: #6B8C76;
    opacity: 0.55;
    text-align: center;
    margin: 8px auto 0;
    max-width: 400px;
    line-height: 1.6;
    white-space: pre;
  }

  .content-wrap {
    padding: 0 24px;
    position: relative;
    z-index: 1;
  }

  .corner-sparkle {
    position: absolute;
    top: 60px;
    right: 8%;
    font-size: 64px;
    font-weight: 700;
    color: #FFABE7;
    line-height: 1;
    z-index: 1;
    filter: drop-shadow(0 0 18px rgba(255,171,231,0.55));
  }

  .prompt-wrap {
    text-align: center;
    max-width: 620px;
    margin: 160px auto 40px;
    padding: 0;
    position: relative;
    z-index: 1;
  }

  .prompt-ghost-wrap {
    position: absolute;
    left: 50%;
    bottom: 100%;
    transform: translateX(-50%);
    margin-bottom: 2px;
    width: 500px;
    height: 28px;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to top, black 0%, transparent 100%);
    mask-image: linear-gradient(to top, black 0%, transparent 100%);
  }

  .prompt-ghost {
    position: absolute;
    left: 50%;
    bottom: 0;
    transform: translateX(-50%);
    font-family: 'Young Serif', serif;
    font-size: 56px;
    font-weight: 400;
    line-height: 1;
    color: #F7F4D5;
    opacity: 0.6;
    white-space: nowrap;
    filter: blur(4px);
    pointer-events: none;
  }

  .highlight-word {
    color: #77FF94;
    text-shadow: 0 0 6px #007E13, 0 0 14px #007E13;
  }

    font-size: 56px;
    font-weight: 600;
    color: #F7F4D5;
    line-height: 1.2;
  }

  .chat-area {
    max-width: 620px;
    margin: 0 auto;
    padding: 0;
    position: relative;
    z-index: 1;
  }

  .chatbox {
    background: rgba(255,255,255,0.03);
    border: 1.5px dashed #6B8C76;
    border-radius: 14px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .chatbox-input {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    color: #F7F4D5;
  }

  .send-wrap { display: inline-flex; align-items: center; justify-content: center; }
  .send-star { width: 18px; height: 18px; cursor: pointer; transition: transform 0.3s ease; }
  .send-wrap:hover .send-star { transform: rotate(90deg) scale(1.2); }

  .archive-preview {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 10px 4px 60px;
  }

  .archive-label { font-size: 13px; color: #F7F4D5; }

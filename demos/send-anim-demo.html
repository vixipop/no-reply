:root{--bg:#0A3323;--grid:rgba(51,107,85,0.08);--pink:#FFABE7;--cream:#F7F4D5;--green:#77FF94;--glow:#007E13;--muted:#6B8C76;}
*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;color:var(--cream);font-family:'Space Grotesk',sans-serif;background-color:var(--bg);
  background-image:
    repeating-linear-gradient(to right,var(--grid) 0,var(--grid) 1px,transparent 1px,transparent 100px),
    repeating-linear-gradient(to bottom,var(--grid) 0,var(--grid) 1px,transparent 1px,transparent 100px),
    repeating-linear-gradient(to right,var(--grid) 0,var(--grid) 1px,transparent 1px,transparent 20px),
    repeating-linear-gradient(to bottom,var(--grid) 0,var(--grid) 1px,transparent 1px,transparent 20px);}
.wrap{max-width:760px;margin:0 auto;padding:28px 24px 80px;position:relative;}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px;}
.brand{font-size:13px;letter-spacing:.06em;color:var(--cream);opacity:.7;}
.archive-icon{width:24px;height:24px;opacity:.75;transition:transform .25s ease;}
.archive-icon.bump{transform:scale(1.35);}
h1{font-family:'Young Serif',serif;font-weight:400;font-size:30px;text-align:center;margin-bottom:6px;}
.sub{text-align:center;font-size:14px;color:rgba(247,244,213,.65);margin-bottom:40px;}
.stage{position:relative;height:150px;display:flex;align-items:center;justify-content:center;}
.composer{width:100%;max-width:560px;}
.prompt{font-family:'Young Serif',serif;font-size:30px;text-align:center;margin-bottom:22px;}
.prompt .hl{color:var(--green);text-shadow:0 0 6px var(--glow),0 0 14px var(--glow);}
.chatbox{background:rgba(255,255,255,.03);border:1.5px dashed var(--muted);border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px;position:relative;}
.chatbox .text{flex:1;font-size:14px;color:var(--cream);}
.star{width:20px;height:20px;flex-shrink:0;cursor:pointer;}
.star svg{display:block;}
.letter{position:absolute;width:26px;height:20px;pointer-events:none;opacity:0;z-index:5;will-change:transform,opacity,filter;}
.letter svg{display:block;width:100%;height:100%;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));}
.microcopy{position:absolute;left:0;right:0;top:calc(50% + 44px);text-align:center;font-size:14px;color:rgba(247,244,213,.7);opacity:0;pointer-events:none;transition:opacity .4s ease;}
.microcopy.show{opacity:1;}
.dot{position:absolute;width:3px;height:3px;border-radius:50%;background:var(--muted);opacity:0;pointer-events:none;z-index:4;}
.controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:48px;}
.btn{background:none;border:1px solid rgba(107,140,118,.5);color:var(--cream);font-family:'Space Grotesk';font-size:14px;padding:12px 18px;border-radius:22px;cursor:pointer;transition:border-color .2s ease;text-align:left;line-height:1.3;}
.btn:hover,.btn:focus-visible{border-color:var(--pink);outline:none;}
.btn b{display:block;font-weight:500;margin-bottom:2px;}
.btn span{font-size:11.5px;color:rgba(247,244,213,.55);}
.hint{text-align:center;font-size:12.5px;color:rgba(247,244,213,.4);margin-top:26px;}
@media (prefers-reduced-motion:reduce){.letter{transition:none;}}
</style>
<div class="wrap">
  <div class="topbar">
    <span class="brand">no reply — motion study</span>
    <svg class="archive-icon" id="archiveIcon" viewBox="0 0 24 24" fill="none" stroke="#F7F4D5" stroke-width="1.4"><rect x="3" y="7" width="18" height="13" rx="1.5"/><path d="M3 7l2-3h14l2 3"/><path d="M10 12h4"/></svg>
  </div>
  <h1>send animation — pick a feel</h1>
  <p class="sub">click a style below. it plays on the box. all kept subtle.</p>
  <div class="stage">
    <div class="composer">
      <div class="prompt">what did i <span class="hl">notice</span> today?</div>
      <div class="chatbox" id="chatbox">
        <span class="text">the light through the window was gold today</span>
        <span class="star" id="star" title="send"><svg viewBox="0 0 20 20"><path d="M10 1 L10 19 M1 10 L19 10 M3.5 3.5 L16.5 16.5 M16.5 3.5 L3.5 16.5" stroke="#FFABE7" stroke-width="1.6" stroke-linecap="round"/></svg></span>
      </div>
    </div>
    <div class="letter" id="letter"><svg viewBox="0 0 26 20"><rect x="1" y="1" width="24" height="18" rx="2" fill="#0A3323" stroke="#FFABE7" stroke-width="1.4"/><path d="M2 3 L13 11 L24 3" fill="none" stroke="#FFABE7" stroke-width="1.4"/></svg></div>
    <div class="microcopy" id="microcopy"></div>
  </div>
  <div class="controls">
    <button class="btn" data-anim="post"><b>1 · post into the distance</b><span>lifts up, shrinks &amp; blurs into the void</span></button>
    <button class="btn" data-anim="fall"><b>2 · fall into the void</b><span>drops down, sinks into the mat</span></button>
    <button class="btn" data-anim="seal"><b>3 · seal &amp; dissolve</b><span>stamped shut, scatters in place</span></button>
    <button class="btn" data-anim="archive"><b>4 · fly to the archive</b><span>zips to the archive icon, top-right</span></button>
  </div>
  <p class="hint">the cream line that fades in is the "it's out of your head now" microcopy — same in every version.</p>
</div>
<script>
const chatbox=document.getElementById('chatbox'),letter=document.getElementById('letter'),micro=document.getElementById('microcopy'),star=document.getElementById('star'),archiveIcon=document.getElementById('archiveIcon'),stage=document.querySelector('.stage');
const LINES=["it's out of your head now.","sealed. no one will ever read this.","said and gone. lighter?","kept. just for you.","that's between you and you."];
let busy=false;const reduce=window.matchMedia('(prefers-reduced-motion:reduce)').matches;
function place(){const s=star.getBoundingClientRect(),st=stage.getBoundingClientRect();letter.style.left=(s.left-st.left+s.width/2-13)+'px';letter.style.top=(s.top-st.top+s.height/2-10)+'px';}
function showMicro(){micro.textContent=LINES[Math.floor(Math.random()*LINES.length)];micro.classList.add('show');setTimeout(()=>micro.classList.remove('show'),1500);}
function resetSoon(){setTimeout(()=>{chatbox.style.transition='opacity .4s ease,transform .4s ease';chatbox.style.opacity='1';chatbox.style.transform='none';busy=false;},700);}
function scatter(){const st=stage.getBoundingClientRect(),s=star.getBoundingClientRect();const cx=s.left-st.left+s.width/2,cy=s.top-st.top+s.height/2;for(let i=0;i<7;i++){const d=document.createElement('div');d.className='dot';d.style.left=cx+'px';d.style.top=cy+'px';stage.appendChild(d);const ang=Math.random()*6.28,dist=18+Math.random()*26;d.animate([{opacity:.7,transform:'translate(0,0)'},{opacity:0,transform:'translate('+Math.cos(ang)*dist+'px,'+Math.sin(ang)*dist+'px)'}],{duration:600,easing:'ease-out',fill:'forwards'});setTimeout(()=>d.remove(),650);}}
function anims(kind){
  if(busy)return;busy=true;place();
  if(reduce){chatbox.style.transition='opacity .3s';chatbox.style.opacity='.5';showMicro();resetSoon();return;}
  chatbox.style.transition='opacity .4s ease .1s';chatbox.style.opacity='.45';
  star.animate([{transform:'rotate(0) scale(1)'},{transform:'rotate(90deg) scale(1.2)'},{transform:'rotate(90deg) scale(1)'}],{duration:400,easing:'ease'});
  let kf,opt={duration:750,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'};
  if(kind==='post'){kf=[{opacity:1,transform:'translate(0,0) scale(1) rotate(0)',filter:'blur(0)'},{opacity:1,offset:.15,transform:'translate(0,-8px) scale(1) rotate(-4deg)',filter:'blur(0)'},{opacity:0,transform:'translate(6px,-92px) scale(.35) rotate(8deg)',filter:'blur(3px)'}];}
  else if(kind==='fall'){kf=[{opacity:1,transform:'translate(0,0) scale(1)'},{opacity:1,offset:.2,transform:'translate(0,-6px) scale(1)'},{opacity:0,transform:'translate(0,120px) scale(.5)',filter:'blur(2px)'}];opt.easing='cubic-bezier(.55,0,.85,.5)';}
  else if(kind==='seal'){star.animate([{transform:'scale(1)'},{transform:'scale(1.5) translateY(3px)'},{transform:'scale(1)'}],{duration:300,easing:'ease'});kf=[{opacity:1,transform:'scale(1)',filter:'blur(0)'},{opacity:1,offset:.35,transform:'scale(1.15)',filter:'blur(0)'},{opacity:0,transform:'scale(.85)',filter:'blur(2px)'}];opt.duration=650;scatter();}
  else if(kind==='archive'){const a=archiveIcon.getBoundingClientRect(),st=stage.getBoundingClientRect(),l=letter.getBoundingClientRect();const dx=(a.left+a.width/2)-(l.left+13),dy=(a.top+a.height/2)-(l.top+10);kf=[{opacity:1,transform:'translate(0,0) scale(1)'},{opacity:1,offset:.2,transform:'translate(0,-8px) scale(1)'},{opacity:0,transform:'translate('+dx+'px,'+dy+'px) scale(.18)'}];setTimeout(()=>{archiveIcon.classList.add('bump');setTimeout(()=>archiveIcon.classList.remove('bump'),220);},560);}
  letter.animate(kf,opt);setTimeout(showMicro,420);resetSoon();
}
document.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',()=>anims(b.dataset.anim)));
star.addEventListener('click',()=>anims('post'));
</script>

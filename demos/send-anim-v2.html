*{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;color:#F7F4D5;font-family:'Space Grotesk',sans-serif;background-color:#0A3323;background-image:repeating-linear-gradient(to right,rgba(51,107,85,.08) 0,rgba(51,107,85,.08) 1px,transparent 1px,transparent 100px),repeating-linear-gradient(to bottom,rgba(51,107,85,.08) 0,rgba(51,107,85,.08) 1px,transparent 1px,transparent 100px),repeating-linear-gradient(to right,rgba(51,107,85,.08) 0,rgba(51,107,85,.08) 1px,transparent 1px,transparent 20px),repeating-linear-gradient(to bottom,rgba(51,107,85,.08) 0,rgba(51,107,85,.08) 1px,transparent 1px,transparent 20px);}
.wrap{max-width:680px;margin:0 auto;padding:70px 24px 120px;}
h1{font-family:'Young Serif',serif;font-weight:400;font-size:28px;text-align:center;margin-bottom:6px;}
.sub{text-align:center;font-size:13.5px;color:rgba(247,244,213,.6);margin-bottom:44px;}
.prompt{font-family:'Young Serif',serif;font-size:34px;text-align:center;margin-bottom:26px;}
.prompt .hl{color:#77FF94;text-shadow:0 0 6px #007E13,0 0 14px #007E13;}
.chatbox{background:rgba(255,255,255,.03);border:1.5px dashed #6B8C76;border-radius:14px;padding:12px 16px;display:flex;align-items:flex-start;gap:12px;}
textarea{flex:1;border:none;outline:none;background:transparent;font-family:'Space Grotesk';font-size:14px;line-height:1.5;color:#F7F4D5;resize:none;overflow:hidden;min-height:22px;}
.star{width:20px;height:20px;flex-shrink:0;margin-top:1px;}
.letter{position:fixed;width:24px;height:18px;pointer-events:none;opacity:0;z-index:60;will-change:transform,opacity,filter;}
.letter svg{width:100%;height:100%;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3));}
.controls{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:46px;}
.btn{background:none;border:1px solid rgba(107,140,118,.5);color:#F7F4D5;font-family:'Space Grotesk';font-size:14px;padding:12px 18px;border-radius:22px;cursor:pointer;transition:border-color .2s;text-align:left;line-height:1.3;}
.btn:hover,.btn:focus-visible{border-color:#FFABE7;outline:none;}
.btn b{display:block;font-weight:500;margin-bottom:2px;}
.btn span{font-size:11.5px;color:rgba(247,244,213,.55);}
.hint{text-align:center;font-size:12.5px;color:rgba(247,244,213,.4);margin-top:26px;line-height:1.6;}
</style>
<div class="wrap">
  <h1>send animation — take 2</h1>
  <p class="sub">now the letter launches from your <b>cursor</b>, not the send star. type, put the caret anywhere, then pick a motion.</p>
  <div class="prompt">what did i <span class="hl">notice</span> today?</div>
  <div class="chatbox">
    <textarea id="ta" rows="1">the light through the window was gold today</textarea>
    <span class="star"><svg viewBox="0 0 20 20"><path d="M10 1 L10 19 M1 10 L19 10 M3.5 3.5 L16.5 16.5 M16.5 3.5 L3.5 16.5" stroke="#FFABE7" stroke-width="1.6" stroke-linecap="round"/></svg></span>
  </div>
  <div class="controls">
    <button class="btn" data-a="drift"><b>A - lift &amp; drift</b><span>floats up from the caret, sways, fades</span></button>
    <button class="btn" data-a="fold"><b>B - fold &amp; vanish</b><span>folds shut in place, tiny pop, gone</span></button>
    <button class="btn" data-a="corner"><b>C - drift to the corner</b><span>glides to bottom-right (where past letters live)</span></button>
    <button class="btn" data-a="settle"><b>D - settle</b><span>lifts, then softly sinks into the mat</span></button>
  </div>
  <p class="hint">all four start exactly where the blinking cursor is.<br>click in the text, move the caret, and replay to see it follow.</p>
</div>
<div class="letter" id="letter"><svg viewBox="0 0 24 18"><rect x="1" y="1" width="22" height="16" rx="2" fill="#0A3323" stroke="#FFABE7" stroke-width="1.4"/><path d="M2 3 L12 10 L22 3" fill="none" stroke="#FFABE7" stroke-width="1.4"/></svg></div>
<script>
const ta=document.getElementById('ta'),letter=document.getElementById('letter');let busy=false;
function autosize(){ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';}
ta.addEventListener('input',autosize);autosize();
function caretXY(){
  const cs=getComputedStyle(ta),m=document.createElement('div');
  ['fontFamily','fontSize','fontWeight','lineHeight','letterSpacing','paddingTop','paddingRight','paddingBottom','paddingLeft','borderTopWidth','borderLeftWidth'].forEach(p=>m.style[p]=cs[p]);
  const r=ta.getBoundingClientRect();
  m.style.position='fixed';m.style.left=r.left+'px';m.style.top=r.top+'px';m.style.width=r.width+'px';
  m.style.whiteSpace='pre-wrap';m.style.wordWrap='break-word';m.style.visibility='hidden';m.style.pointerEvents='none';
  const pos=(document.activeElement===ta && ta.selectionEnd!=null)?ta.selectionEnd:ta.value.length;
  m.textContent=ta.value.substring(0,pos);
  const span=document.createElement('span');span.textContent='\u200b';m.appendChild(span);
  document.body.appendChild(m);const s=span.getBoundingClientRect();document.body.removeChild(m);
  return {x:s.left,y:s.top};
}
function play(kind){
  if(busy)return;busy=true;const c=caretXY();
  letter.style.left=(c.x-12)+'px';letter.style.top=(c.y-9)+'px';
  let kf,opt={duration:850,easing:'cubic-bezier(.33,0,.2,1)',fill:'forwards'};
  if(kind==='drift'){kf=[{opacity:0,transform:'translate(0,0) scale(.7)'},{opacity:1,offset:.2,transform:'translate(2px,-14px) scale(1)'},{opacity:1,offset:.55,transform:'translate(-6px,-46px) scale(1) rotate(-5deg)'},{opacity:0,transform:'translate(4px,-84px) scale(.9) rotate(4deg)'}];opt.duration=950;}
  else if(kind==='fold'){kf=[{opacity:0,transform:'scaleX(1.5) scaleY(.35)'},{opacity:1,offset:.35,transform:'scaleX(1) scaleY(1)'},{opacity:1,offset:.6,transform:'scale(1.12)'},{opacity:0,transform:'scale(.8)',filter:'blur(1.5px)'}];opt.duration=620;}
  else if(kind==='corner'){const tx=window.innerWidth-60-c.x,ty=window.innerHeight-60-c.y;kf=[{opacity:0,transform:'translate(0,0) scale(.7)'},{opacity:1,offset:.18,transform:'translate(0,-10px) scale(1)'},{opacity:0,transform:'translate('+tx+'px,'+ty+'px) scale(.4)'}];}
  else if(kind==='settle'){kf=[{opacity:0,transform:'translate(0,0) scale(.7)'},{opacity:1,offset:.3,transform:'translate(0,-16px) scale(1)'},{opacity:1,offset:.6,transform:'translate(0,-6px) scale(1)'},{opacity:0,transform:'translate(0,14px) scale(.94)',filter:'blur(1.5px)'}];opt.duration=780;}
  letter.animate(kf,opt);setTimeout(()=>{busy=false;},opt.duration);
}
document.querySelectorAll('.btn').forEach(b=>b.addEventListener('click',()=>play(b.dataset.a)));
</script>
